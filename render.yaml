services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RUN_CONSUMER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: shortener-cache
          property: connectionString

  - type: keyvalue
    name: shortener-cache
    plan: free
    ipAllowList: []

databases:
  - name: shortener-db
    plan: free